    .hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.metric{min-width:0;border:1px solid #465083;border-radius:12px;background:#121a3b;padding:8px;text-align:center;box-shadow:inset 0 1px #fff1}.metric small{display:block;color:var(--muted);font-size:11px}.metric b{display:block;margin-top:2px;color:var(--gold);font-size:20px;overflow:hidden;text-overflow:ellipsis}

    .board{position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:4px;aspect-ratio:1;border:4px solid #ffd166;border-radius:14px;padding:5px;background:#34220f;box-shadow:inset 0 0 0 3px #6f4612,0 0 12px #ffd16644}.board.train-board{border-color:#79efff;background:radial-gradient(circle,#6c218d,#24134f 62%,#071a3a);box-shadow:inset 0 0 0 3px #d599ff,0 0 20px #55deff99}.track{position:relative;min-width:0;border:2px solid #e0b85b;border-radius:7px;background:linear-gradient(145deg,#fff7d6,#ffd478);color:#301a05;display:grid;place-items:center;padding:1px 1px 7px;cursor:pointer;transition:.08s transform,.08s filter,.08s box-shadow}.train-board .track{border-color:#e8b7ff;background:linear-gradient(145deg,#f6e8ff,#8ddfff 52%,#9e4bd0);box-shadow:inset 0 0 5px #fff}.track .emoji{font-size:clamp(19px,6.2vw,32px);line-height:1}.track .symbol-img{width:94%;height:94%;object-fit:contain}.track.special .emoji,.track.once .emoji{font-size:clamp(8px,2.25vw,12px);font-weight:1000;line-height:.9;text-align:center}.track.train{background:radial-gradient(circle,#fff8c9,#7f41d3 58%,#261347);border-color:#ffe47a}.track.crown{background:linear-gradient(145deg,#fffbd4,#ffb52e);border-color:#fff19a}.lamp{position:absolute;left:50%;bottom:1px;width:10px;height:6px;transform:translateX(-50%);border:1px solid #7a1118;border-radius:1px;background:linear-gradient(#67131a,#260407);box-shadow:inset 0 1px #b74b53,0 1px 1px #000}.track.active{z-index:2;transform:scale(1.1);filter:saturate(1.35);border-color:#fff;box-shadow:0 0 16px 5px #ff3d9e,0 0 6px 2px #fff}.track.active .lamp,.track.win .lamp,.track.train-win .lamp,.track.crown-win .lamp{background:#ff263b;border-color:#ff8290;box-shadow:0 0 5px 2px #ff1b32,0 0 12px 4px #d90026,inset 0 1px #fff}.track.train-win{z-index:2;transform:scale(1.06);border-color:#fff;box-shadow:0 0 16px 5px #30d9ff,0 0 6px 2px #fff}.track.crown-win{z-index:2;transform:scale(1.06);border-color:#fff9bf;box-shadow:0 0 18px 6px #ffd238,0 0 7px 2px #fff}.track.win{animation:winPulse .55s ease-in-out 4 alternate}.center{grid-column:2/7;grid-row:2/7;position:relative;overflow:hidden;border:2px solid #ff63c5;border-radius:13px;background:radial-gradient(circle at 50% 24%,#2f4e92,#14244d 45%,#0c1538);display:grid;place-items:center;text-align:center;padding:6px}.center:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,#783dff44,transparent,#ff3d9e44,transparent);animation:rotate 9s linear infinite}.center.train-mode{border-color:#ffe47a;background:radial-gradient(circle at 50% 30%,#6b248c,#24205f 50%,#09163b);box-shadow:inset 0 0 24px #26dfff55}.center.crown-mode{border-color:#ffd166;background:radial-gradient(circle at 50% 24%,#704713,#33204e 48%,#120d29)}.mascot,.status{position:relative;z-index:1}.mascot{display:block;width:clamp(92px,29vw,150px);height:clamp(135px,43vw,220px);margin:0 auto -6px;object-fit:contain;filter:drop-shadow(0 8px 5px #0008)}.center.train-mode .mascot{width:96%;height:auto;max-height:172px;margin:-8px auto -10px;filter:drop-shadow(0 7px 7px #000b) drop-shadow(0 0 8px #55e5ff)}.jp{position:relative;z-index:1;font-size:clamp(25px,8vw,44px);font-weight:1000;line-height:.8;background:linear-gradient(#fff,#ffd166,#ff8a3d);background-clip:text;color:transparent;filter:drop-shadow(0 3px #8b2553)}.mode-logo{position:relative;z-index:1;display:block;width:96%;max-height:78px;margin:0 auto -5px;object-fit:contain;filter:drop-shadow(0 4px 4px #000a) drop-shadow(0 0 7px #7f55ff)}.jp-lamp{position:relative;z-index:1;display:block;width:22px;height:12px;margin:7px auto 1px;border:2px solid #79131c;border-radius:2px;background:#ff2439;box-shadow:0 0 7px 2px #ff1b32,0 0 17px 5px #b90022,inset 0 2px #ff98a2;animation:lampPulse 1.15s ease-in-out infinite alternate}.status{margin-top:5px;color:#dce3ff;font-size:12px;font-weight:900;min-height:2.8em;display:grid;place-items:center}.status .symbol-img{width:38px;height:38px;object-fit:contain;vertical-align:middle}.status strong{color:var(--gold)}

    .bets{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}.bet{position:relative;min-width:0;min-height:88px;border:1px solid #4b5589;border-radius:8px;background:linear-gradient(145deg,#1d2755,#111735);color:#fff;padding:20px 2px 3px;cursor:pointer;box-shadow:0 3px 0 #080d22}.bet .emoji{display:block;font-size:clamp(18px,5vw,27px);line-height:1}.bet .symbol-img{display:block;width:clamp(26px,7vw,38px);height:clamp(26px,7vw,38px);margin:auto;object-fit:contain}.bet .name{display:block;margin-top:2px;font-size:8px;color:#b8c1eb;white-space:nowrap}.bet .odds{position:absolute;inset:2px 2px auto;border-radius:4px;background:#ffd166;color:#462900;padding:1px;font-size:9px;font-weight:1000}.bet b.led-display{display:flex;margin:2px auto 0;padding:2px 1px;width:max-content;max-width:100%;gap:1px}.bet .seven{width:7px;height:13px}.bet .seven .a,.bet .seven .d,.bet .seven .g{left:2px;width:4px;height:2px}.bet .seven .a{top:0}.bet .seven .g{top:6px}.bet .seven .d{bottom:0}.bet .seven .b,.bet .seven .c,.bet .seven .e,.bet .seven .f{width:2px;height:5px}.bet .seven .b,.bet .seven .f{top:1px}.bet .seven .c,.bet .seven .e{bottom:1px}.bet.selected{border-color:#ff66c4;box-shadow:0 0 9px #ff3d9e66,0 3px 0 #5b1b65}
    .actions{display:grid;grid-template-columns:1fr 1.8fr 1fr;gap:8px;margin-top:11px}.actions button{min-height:50px;border-radius:14px;border:1px solid #59639a;background:#182149;color:#dce3ff;font-weight:1000;cursor:pointer}.actions .spin{border-color:#ff8ccf;background:linear-gradient(110deg,#783dff,#ff3d9e 60%,#ff8a3d);color:#fff;font-size:20px;box-shadow:0 5px 0 #78164f,0 0 14px #ff3d9e77}.actions button:disabled{opacity:.5;cursor:not-allowed}.message{min-height:37px;margin:10px 1px 0;border:1px solid #3d477a;border-radius:10px;background:#0d1430;padding:8px 10px;color:#aeb8e8;text-align:center;font-size:12px}.message.win{border-color:#ffd166;color:#ffe89c;box-shadow:0 0 10px #ffd16633}
    .history{margin-top:10px;border:1px solid #35406d;border-radius:12px;background:#0d1430;overflow:hidden}.history h2{margin:0;padding:8px 11px;background:#151d42;font-size:13px;color:#cbd3fb}.history ol{margin:0;padding:7px 10px 7px 31px;min-height:48px;color:#929dc9;font-size:11px}.history li+li{margin-top:3px}
    dialog{width:min(calc(100% - 28px),480px);border:1px solid #783dff;border-radius:20px;background:linear-gradient(155deg,#171f49,#0d1430);color:#f8faff;padding:0;box-shadow:0 20px 80px #000d}dialog::backdrop{background:#050817d9;backdrop-filter:blur(6px)}dialog h2{margin:0;padding:13px;text-align:center;background:linear-gradient(100deg,#783dff,#ff3d9e 60%,#ff8a3d);font-size:20px}dialog .rules{padding:15px 18px;line-height:1.65;color:#ccd4fa;font-size:13px}dialog ol{padding-left:22px}dialog table{width:100%;border-collapse:collapse;margin:10px 0}dialog td{border-bottom:1px solid #374172;padding:5px;text-align:center}dialog button{display:block;width:calc(100% - 36px);margin:0 18px 17px;border:1px solid #ffd166;border-radius:11px;background:#202956;color:#ffd166;padding:9px;font-weight:900}.auto-copy{text-align:center;color:#cbd3fb;padding:13px 16px 5px}.auto-rounds{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 18px}.auto-rounds button{width:auto;margin:0;min-height:48px;font-size:18px;background:linear-gradient(135deg,#3b277d,#c52d9b);color:#fff;border-color:#ff8bd1}.auto-cancel{margin-top:8px!important}
    .center.crown-mode .mascot{width:91%;height:auto;max-height:170px;margin:-7px auto -10px;filter:drop-shadow(0 7px 7px #000b) drop-shadow(0 0 9px #ffd44f)}.center.crown-mode .mode-logo{width:94%;max-height:72px;filter:drop-shadow(0 4px 4px #000a) drop-shadow(0 0 7px #ffd44f)}
    .status .symbol-img{width:26px!important;height:26px!important}
    /* 傳統版：小丑縮一點，下方的狀態文字才不會被裁掉 */
    .center:not(.train-mode):not(.crown-mode) .mascot{height:clamp(100px,31vw,165px);width:auto;max-width:clamp(80px,26vw,130px)}
    @keyframes rotate{to{transform:rotate(1turn)}}@keyframes winPulse{to{filter:brightness(1.3);box-shadow:0 0 22px 8px #ffd166;transform:scale(1.12)}}@keyframes lampPulse{to{filter:brightness(1.35);box-shadow:0 0 10px 3px #ff1b32,0 0 24px 7px #b90022,inset 0 2px #fff}}
    @media(max-width:390px){.app{padding-inline:8px}.board{gap:2px;padding:4px}.track{border-width:1px}.track .emoji{font-size:20px}.bets{gap:2px}.bet{min-height:70px}.bet .name{font-size:7px}.brand strong{font-size:20px}}
    @media(prefers-reduced-motion:reduce){.center:before{animation:none}.track.win{animation:none}}
  </style>
</head>
<body>
<main class="app">
  <header><button class="back" id="backButton" aria-label="返回 GD 大廳">‹</button><div class="brand"><strong id="gameTitle">GD 小瑪莉</strong><small id="gameSubtitle">LITTLE MARY</small></div><div class="header-actions"><span class="dev" id="modeTag">試玩</span><button class="icon-btn" id="soundButton" aria-label="關閉音效" aria-pressed="true">♪</button><button class="icon-btn" id="rulesButton" aria-label="玩法與最近結果">?</button></div></header>
  <section class="machine" aria-label="小瑪莉機台">
    <div class="display"><span>WIN<div class="led-display" id="winDisplay" aria-label="WIN 0000"></div></span><span>CREDIT<div class="led-display" id="creditDisplay" aria-label="CREDIT 1000"></div></span></div>
    <div class="board" id="board"><div class="center"><div><img class="mode-logo" id="modeLogo" src="img/magic-train-title.webp" alt="魔幻列車" hidden><img class="mascot" src="img/jp-joker.webp" alt="JP JOKER"><div class="jp">JP JOKER</div><span class="jp-lamp" aria-hidden="true"></span><div class="status" id="status">選擇下方符號後<br>按下<strong>啟動</strong></div></div></div></div>
  </section>
  <div class="bet-head"><b>選擇下注符號</b><div class="chips" aria-label="下注面額"><button class="chip active" data-chip="1">1</button><button class="chip" data-chip="5">5</button><button class="chip" data-chip="10">10</button><button class="chip" data-chip="20">20</button><button class="chip" data-chip="100">100</button><button class="chip" data-chip="500">500</button></div></div>
  <section class="bets" id="bets" aria-label="符號下注區"></section>
  <div class="actions"><button id="clearButton">清除</button><button class="spin" id="spinButton">啟動</button><button id="autoButton">自動投注</button></div>
  <div class="message" id="message" role="status">選擇面額與符號後按「啟動」</div>
</main>
<dialog id="rulesDialog"><h2 id="rulesTitle">小瑪莉玩法</h2><div class="rules"><ol id="modeRules"></ol><table><tbody id="paytable"></tbody></table><p id="modeNote">從大廳進入時使用 GD 錢包；直接開啟此頁為試玩，點數只存在這台裝置。結果由伺服器以 SHA-256 決定（開局前先公布伺服器種子的雜湊），押哪個符號理論回報率都是 <b id="rtpText">—</b>。</p><section class="history"><h2>最近結果</h2><ol id="history"><li>尚未進行遊戲</li></ol></section></div><button id="closeRules">我知道了</button></dialog>
<dialog id="autoDialog"><h2>自動投注</h2><div class="auto-copy">重複使用目前（上一把）投注配置<br>請選擇自動投注場次</div><div class="auto-rounds"><button data-rounds="5">5 場</button><button data-rounds="10">10 場</button><button data-rounds="20">20 場</button><button data-rounds="50">50 場</button></div><button class="auto-cancel" id="closeAuto">取消</button></dialog>
<script>
  (()=>{
    // 小瑪莉三款：?mode=classic（傳統小瑪莉 little-mary）、train（魔幻列車 magic-train）、crown（皇冠列車 crown-train）。
    // 結果由 SHA-Platform 決定（apps/edge-api/src/littlemary.ts、littlemary-express.ts），這頁只播放；直接開啟為試玩，用同一套算法在瀏覽器算。
    const query=new URLSearchParams(location.search);
    const mode=['classic','train','crown'].includes(query.get('mode'))?query.get('mode'):'classic';
    const GAME={classic:'little-mary',train:'magic-train',crown:'crown-train'}[mode];
    const ORDER=['apple','watermelon','star','seven','bar','bell','melon','orange','grape'];
    const NAMES={apple:['🍎','蘋果'],watermelon:['🍉','西瓜'],star:['⭐','雙金星'],seven:['7️⃣','雙七'],bar:['▰','BAR'],bell:['🔔','鈴鐺'],melon:['🍈','香瓜'],orange:['🍊','橘子'],grape:['🍇','葡萄']};
    const SPECIAL={
      once:{icon:'ONCE<br>MORE',name:'再來一次',kind:'classic'},
      train:{icon:'🚂',asset:'img/train-head.webp',name:'魔幻列車',kind:'train'},car3:{icon:'+3',asset:'img/train-plus3.webp',name:'三節魔幻車廂',kind:'train'},car5:{icon:'+5',asset:'img/train-plus5.webp',name:'五節魔幻車廂',kind:'train'},
      crown:{icon:'BONUS',asset:'img/crown-bonus.webp',name:'皇冠 BONUS',kind:'crown'},jp:{icon:'JP 500',asset:'img/crown-jp.webp',name:'GRAND JP',kind:'crown'},
      mult2:{icon:'×2',name:'雙倍站',kind:'crown'},mult3:{icon:'×3',name:'三倍站',kind:'crown'},mult5:{icon:'×5',name:'五倍站',kind:'crown'}
    };
    const PAYS={apple:5,watermelon:20,star:30,seven:40,bar:50,bell:20,melon:15,orange:10,grape:2};
    // 伺服器 /config 讀不到時（試玩）用的預設值，與 SHA-Platform 相同
    const DEFAULTS={
      classic:{track:['orange','bell','grape','bar','apple','grape','melon','watermelon','grape','once','apple','grape','orange','bell','grape','seven','apple','grape','melon','star','grape','once','apple','grape'],
        weights:{apple:176076,watermelon:44019,star:29346,seven:22009,bar:17607,bell:44019,melon:58692,orange:88038,grape:440194},onceWeight:80000,total:1000000,maxSpins:20,rtp:0.9569},
      train:{track:["apple", "watermelon", "train", "grape", "bell", "apple", "car3", "orange", "grape", "melon", "seven", "apple", "train", "grape", "bar", "bell", "watermelon", "car5", "apple", "grape", "star", "orange", "train", "grape"],cellWeights:[4758865, 2346365, 69010, 9583867, 2346365, 4758865, 138020, 4758865, 9583866, 6367198, 2346365, 4758865, 69010, 9583866, 1863865, 2346365, 2346365, 69010, 4758865, 9583866, 3150531, 4758865, 69010, 9583866],rtp:0.965},
      crown:{track:["apple", "mult2", "grape", "crown", "bell", "orange", "jp", "watermelon", "grape", "seven", "mult3", "apple", "crown", "grape", "bar", "bell", "jp", "melon", "apple", "mult5", "star", "grape", "crown", "orange"],cellWeights:[5179425, 5554095, 10496455, 1000000, 1247722, 3761027, 500, 3333644, 10496454, 1371289, 5554095, 5179425, 1000000, 10496454, 1025590, 1247721, 500, 4996687, 5179425, 5554095, 2067917, 10496454, 1000000, 3761026],rtp:0.965,stationWeights:{"apple": 1000, "watermelon": 1000, "star": 1000, "seven": 1000, "bar": 1000, "bell": 1000, "melon": 1000, "orange": 1000, "grape": 1000, "crown": 1000, "mult2": 600, "mult3": 350, "mult5": 150, "jp": 3},jpMultiplier:500,stations:5,steps:[3,10]}
    };
    let RULES={...DEFAULTS[mode],pays:PAYS};
    const N=24;
    const byId=id=>SPECIAL[id]?{id,...SPECIAL[id],pay:0}:{id,icon:NAMES[id][0],name:NAMES[id][1],asset:`img/${id}.webp`,pay:RULES.pays[id]};
    const positions=[...Array(7)].map((_,i)=>[1,i+1]).concat([...Array(5)].map((_,i)=>[i+2,7]),[...Array(7)].map((_,i)=>[7,7-i]),[...Array(5)].map((_,i)=>[6-i,1]));
    const bets=Object.fromEntries(ORDER.map(id=>[id,0]));
    const $=s=>document.querySelector(s),board=$('#board'),betsEl=$('#bets'),message=$('#message'),spinButton=$('#spinButton');
    const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
    const sha256=async s=>hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));
    const randomHex=n=>hex(crypto.getRandomValues(new Uint8Array(n)));

    // ---------- 連線（大廳）或試玩 ----------
    let token=new URLSearchParams(location.hash.slice(1)).get('token');

    autoButton.onclick=()=>{if(autoRunning){autoRunning=false;syncAutoButton();announce('將於本場結束後停止自動投注');return}if(spinning)return;if(totalBet()<=0){announce('請先下注一把，再設定自動投注');return}autoDialog.showModal()};
    document.querySelectorAll('[data-rounds]').forEach(b=>b.onclick=()=>startAuto(Number(b.dataset.rounds)));$('#closeAuto').onclick=()=>autoDialog.close();
    soundButton.onclick=()=>{soundEnabled=!soundEnabled;localStorage.setItem('gdLittleMarySound',soundEnabled?'on':'off');syncSoundButton();if(soundEnabled)tone(660,.08,.03,'sine')};syncSoundButton();
    const rules=$('#rulesDialog');$('#rulesButton').onclick=()=>rules.showModal();$('#closeRules').onclick=()=>rules.close();
    // 返回大廳：只接受 gdclub.cc 系列網址（GDBO 給的 return），否則回大廳首頁
    const back=(()=>{try{const u=new URL(query.get('return')||'/',location.href);return /(^|\.)gdclub\.cc$|^(localhost|127\.0\.0\.1)$/.test(u.hostname)||u.origin===location.origin?u.href:'/'}catch{return '/'}})();
    $('#backButton').onclick=()=>location.href=back;
    $('#modeTag').textContent=remote?'GD 錢包':'試玩';
    build();sync();
    connect().then(()=>{build();shown=balance;sync()}).catch(e=>{announce(e.message);spinButton.disabled=true});
  })();
</script>
</body>
</html>
